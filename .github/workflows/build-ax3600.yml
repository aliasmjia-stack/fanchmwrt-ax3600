name: Build FanchmWrt 25.12.6 Latest for Xiaomi AX3600 (Real Big Partition 240MB)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_URL: https://github.com/fanchmwrt/fanchmwrt
  REPO_BRANCH: fanchmwrt-25.12.6
  CONFIG_FILE: fanchmwrt_ax3600_ci/ax3600_bigpart.config
  DIY_P1_SH: fanchmwrt_ax3600_ci/diy-part1.sh
  DIY_P2_SH: fanchmwrt_ax3600_ci/diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出当前仓库
      uses: actions/checkout@v4

    - name: 初始化编译依赖环境与系统深度清理
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        docker image prune -a -f
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
          mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
          python3-docutils qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl \
          unzip vim wget xmlto xxd zlib1g-dev libfuse-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 克隆 FanchmWrt 官方最新 25.12.6 源码
      working-directory: /workdir
      run: |
        df -h
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 加载自定义 Feed 源配置 (diy-part1.sh)
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新与安装 Feeds 扩展包
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 注入小米 AX3600 大分区专属补丁与配置 (锁定48MB/360块大分区)
      run: |
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
        make defconfig
        cat $GITHUB_WORKSPACE/$CONFIG_FILE >> .config
        make defconfig
        echo "=== 检查最终生成的关键配置项 ==="
        grep -E 'ROOTFS_PARTSIZE|CONFIG_PACKAGE_luci=|CONFIG_PACKAGE_kmod-qca-nss' .config

    - name: 预下载依赖软件包缓存 (Download dl)
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 开始多核心全速编译
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) 核心全速编译中..."
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 整理与提取大分区固件产物
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        echo "=== 编译生成的文件列表 ==="
        ls -lh

    - name: 上传构建产物至 GitHub Artifacts 备份
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: FanchmWrt_25.12.6_AX3600_BigPart_${{ github.run_id }}
        path: ${{ env.FIRMWARE }}

    - name: 发布最新版 25.12.6 大分区专属固件到 GitHub Releases
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: FanchmWrt-25.12.6-AX3600-BigPart-${{ github.run_number }}
        files: ${{ env.FIRMWARE }}/*
